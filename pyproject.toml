[project]
name = "manara-image-pipeline"
version = "0.1.0"
description = "AWS SAA graduation project: resilient serverless image processing"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "Pillow>=12.0,<13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
